name: CI - Static Code Analysis & Linting

on:
  pull_request:
    branches: [ "main", "master", "dev" ]
  push:
    branches: [ "main", "master", "dev" ]

jobs:
  lint-and-check:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Client Dependencies
        run: |
          if [ -d "client" ]; then
            cd client && npm ci || npm install
          fi
        shell: bash

      - name: Lint Client
        run: |
          if [ -d "client" ]; then
            cd client && npm run lint --if-present
          fi
        shell: bash

      - name: Install Server Dependencies
        run: |
          if [ -d "server" ]; then
            cd server && npm ci || npm install
          fi
        shell: bash

      - name: Lint Server
        run: |
          if [ -d "server" ]; then
            cd server && npm run lint --if-present
          fi
        shell: bash
